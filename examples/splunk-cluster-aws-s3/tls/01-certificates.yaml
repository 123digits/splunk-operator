    - server auth
    - client auth
    - digital signature
    - key encipherment
  additionalOutputFormats:
    - type: CombinedPEM
  # KV store requires an O, OU or DC in the subject once TLS verification is
  # on. Some ACME services strip subject fields - check the issued cert.
  subject:
    organizations:
      - Example Org   # REPLACE with your org name
