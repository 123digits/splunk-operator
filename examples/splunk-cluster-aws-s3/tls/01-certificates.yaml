    - splunk-shc-search-head-headless.splunk.svc.cluster.local
    - splunk-shc-search-head-0.splunk-shc-search-head-headless.splunk.svc.cluster.local
    - splunk-shc-search-head-1.splunk-shc-search-head-headless.splunk.svc.cluster.local
    - splunk-shc-search-head-2.splunk-shc-search-head-headless.splunk.svc.cluster.local
    # The deployer is part of the SearchHeadCluster CR, so it mounts this cert.
    - splunk-shc-deployer-service.splunk.svc.cluster.local
    - splunk-shc-deployer-headless.splunk.svc.cluster.local
    - splunk-shc-deployer-0.splunk-shc-deployer-headless.splunk.svc.cluster.local
---
