# Per-tier certificates from the org ACME issuer.
#
# SAN POLICY: names ending in .svc.cluster.local, plus localhost. No IP
# addresses, no short service names, no .svc. Everything else in tls/ is built
# so that nothing ever needs one of those:
#   - splunk-ansible's REST calls are redirected from 127.0.0.1 to localhost
#     by tls/ansible-library/splunk_api.py, and verify against the localhost
#     SAN (see tls/README.md, "Ansible").
#   - the probes connect to the pod FQDN, pinned to 127.0.0.1 with
#     curl --resolve - a stronger check than localhost, which any org server
#     cert may carry.
#   - splunkd peer checks pin identities with sslAltNameToCheck instead of
#     matching the dialled hostname, which is often a pod IP.
#
# Each pod's own FQDN must be present: <pod>.<headless-svc>.splunk.svc.cluster.local.
# They are listed explicitly because ACME services commonly refuse wildcards
# for names they cannot DNS-01 validate. Scaling a tier past the names listed
# here means adding names and letting cert-manager reissue BEFORE scaling;
# a pod missing from its cert fails its own readiness probe.
#
# If your ACME service does issue wildcards, each explicit pod list can be
# replaced with one "*.<headless-svc>.splunk.svc.cluster.local" entry.
#
# commonName is set to a name that is also in dnsNames: many ACME services
# reject a CN that is not one of the SANs. Org policy caps CN at 63 characters
# (SANs at 255), which is why the CN is the tier SERVICE name (52-58 chars
# here) and never a pod FQDN (~87). A longer CR name can push the service name
# past 63; then drop commonName and rely on dnsNames alone.
#
# additionalOutputFormats: CombinedPEM adds tls-combined.pem (key + chain in
# one file), which is what splunkd's serverCert / clientCert want. It needs the
# AdditionalCertificateOutputFormats feature gate on older cert-manager.
#
# encoding: PKCS1 - Splunk expects traditional RSA PEM. The key is generated
# by cert-manager, not the ACME server, so this holds for ACME issuers too.
#
# No duration: ACME servers set validity themselves and ignore the request.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: splunk-indexer-tls
  namespace: splunk
spec:
  secretName: splunk-indexer-tls
  renewBefore: 360h   # 15d
  issuerRef:
    name: org-acme
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS1
  # Mutual TLS presents these as CLIENT certs too (S2S, forwarding). If the
  # ACME service issues serverAuth-only certs, peers reject them as clients.
  usages:
    - server auth
    - client auth
    - digital signature
    - key encipherment
  additionalOutputFormats:
    - type: CombinedPEM
  # KV store requires an O, OU or DC in the subject once TLS verification is
  # on. Some ACME services strip subject fields - check the issued cert.
  subject:
    organizations:
      - Example Org   # REPLACE with your org name
  commonName: splunk-idxc-indexer-service.splunk.svc.cluster.local
  dnsNames:
    # Lets splunk-ansible verify its loopback REST calls (tls/ansible-library).
    - localhost
    # Pinned identity for this tier - see sslAltNameToCheck in 02-tls-defaults.
    - splunk-idxc-indexer-service.splunk.svc.cluster.local
    - splunk-idxc-indexer-headless.splunk.svc.cluster.local
    # One per replica (05-indexercluster.yaml replicas: 3).
    - splunk-idxc-indexer-0.splunk-idxc-indexer-headless.splunk.svc.cluster.local
    - splunk-idxc-indexer-1.splunk-idxc-indexer-headless.splunk.svc.cluster.local
    - splunk-idxc-indexer-2.splunk-idxc-indexer-headless.splunk.svc.cluster.local
---
