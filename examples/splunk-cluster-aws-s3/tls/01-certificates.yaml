# Browser-facing cert for the hostnames Traefik serves. Consumed by Traefik
# only; Splunk pods never mount it (Splunk Web presents its tier cert, which
# Traefik verifies on the re-encrypt leg). The hostnames must be ones your
# certificate policy permits for user-facing names - replace accordingly.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: splunk-public-tls
  namespace: splunk
spec:
  secretName: splunk-public-tls
  renewBefore: 360h
  issuerRef:
    name: org-acme
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - splunk.example.com      # REPLACE
    - mc.splunk.example.com   # REPLACE
    - cm.splunk.example.com   # REPLACE
    - hec.splunk.example.com  # REPLACE - traefik/03 terminates HEC with this cert
