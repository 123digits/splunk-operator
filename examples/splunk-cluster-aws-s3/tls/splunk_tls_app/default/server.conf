# splunkd management + inter-node TLS (port 8089) and index replication.
#
# AUTHENTICITY is the point here, not just encryption:
#   sslVerifyServerCert = true  -> the peer cert must chain to our CA
#   sslVerifyServerName = true  -> the peer's CN/SAN must match who we dialled
#
# Both are required. sslVerifyServerCert ALONE does not check the hostname, so
# any cert signed by our CA would be accepted from any peer - which downgrades
# the CA to a shared secret. sslVerifyServerName is what makes it authentication.

[sslConfig]
enableSplunkdSSL = true
serverCert = /mnt/splunk-tls/tls-combined.pem
sslRootCAPath = /mnt/splunk-tls/ca.crt
sslVerifyServerCert = true
sslVerifyServerName = true
# Do not fall back to Splunk's shipped default certs, whose private keys are
# published in every Splunk distribution and therefore authenticate nothing.
sslVersions = tls1.2, tls1.3
cipherSuite = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# Index replication between peers (default port 9887).
[replication_port-ssl://9887]
serverCert = /mnt/splunk-tls/tls-combined.pem
sslRootCAPath = /mnt/splunk-tls/ca.crt
# Mutual TLS: a peer must present a cert from our CA to replicate buckets.
requireClientCert = true
