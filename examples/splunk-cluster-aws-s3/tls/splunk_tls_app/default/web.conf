# Splunk Web TLS (port 8000).
#
# Only needed if you serve Splunk Web over TLS passthrough through Traefik. If
# Traefik terminates and re-encrypts, this still applies - the re-encrypt leg
# needs Splunk to be listening on HTTPS.
#
# Note this points at the PUBLIC cert, not the internal CA one, because a
# browser must trust it. See traefik/README.md for which model you are using.

[settings]
enableSplunkWebSSL = true
privKeyPath = /mnt/splunk-public-tls/tls.key
serverCert = /mnt/splunk-public-tls/tls.crt
