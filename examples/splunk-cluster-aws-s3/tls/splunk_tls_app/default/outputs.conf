# S2S sending. The forwarding side must verify the indexer it connects to.
#
# sslCommonNameToCheck / sslAltNameToCheck pin WHICH identity is acceptable.
# Without one of them, sslVerifyServerCert only proves the peer holds some cert
# from our CA - it does not prove it is an indexer.

[tcpout]
defaultGroup = idxc

[tcpout:idxc]
server = splunk-idxc-indexer-service:9997
clientCert = /mnt/splunk-tls/tls-combined.pem
sslRootCAPath = /mnt/splunk-tls/ca.crt
sslVerifyServerCert = true
sslCommonNameToCheck = splunk-idxc-indexer
sslAltNameToCheck = splunk-idxc-indexer-service, splunk-idxc-indexer-headless
sslVersions = tls1.2, tls1.3
useACK = true
