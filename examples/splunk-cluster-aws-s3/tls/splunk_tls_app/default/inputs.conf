# S2S receiving on the indexers (and ingestors). Mutual TLS.
#
# requireClientCert = true means a forwarder must present a certificate signed
# by our CA. Without it, anyone who can reach port 9997 can inject events - TLS
# would give you confidentiality with no idea who is sending.

[splunktcp-ssl:9997]
disabled = 0

[SSL]
serverCert = /mnt/splunk-tls/tls-combined.pem
sslRootCAPath = /mnt/splunk-tls/ca.crt
requireClientCert = true
sslVersions = tls1.2, tls1.3
