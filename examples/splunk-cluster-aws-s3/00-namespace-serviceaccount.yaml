# Namespace + the IRSA-annotated ServiceAccount every Splunk CR references.
#
# The operator itself lives in the "splunk-operator" namespace; this is the
# namespace the Splunk deployment lives in. If you installed the operator with
# WATCH_NAMESPACE set, add "splunk" to that list or nothing here reconciles.
---
apiVersion: v1
kind: Namespace
metadata:
  name: splunk
---
# Replace <ACCOUNT_ID> and the role name with the IRSA role you created from
# iam/splunk-s3-policy.json. Creating this with `eksctl create iamserviceaccount`
# produces the same object; applying it by hand is fine as long as the role's
# trust policy names this namespace + SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: splunk-s3
  namespace: splunk
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/SplunkS3Access
