# IndexerCluster - the peers. Deliberately thin:
#   - no smartstore stanza (inherited from the ClusterManager bundle)
#   - no appRepo (not supported on this CRD; apps arrive via CM bundle push)
# Spread peers across AZs so one zone loss cannot take the cluster down.
apiVersion: enterprise.splunk.com/v4
kind: IndexerCluster
metadata:
  annotations:
    # kiam: propagated to the pod template by the operator via AppendParentMeta,
    # so the pods assume this role. Must match the namespace's permitted regex.
    # Changing this value changes the pod template -> rolling restart.
    iam.amazonaws.com/role: SplunkS3Access
  name: idxc
  namespace: splunk
  finalizers:
  - enterprise.splunk.com/delete-pvc
spec:
  # TLS - see tls/README.md and the same block in 03-licensemanager.yaml.
  # Indexers load indexer.yml: it adds S2S mutual TLS and HEC over TLS.
  volumes:
    - name: splunk-tls
      secret:
        secretName: splunk-indexer-tls
        defaultMode: 0400
    - name: splunk-ca
      secret:
        secretName: all-trusted-partners
        defaultMode: 0444
    - name: tls-defaults
      configMap:
        name: splunk-tls-defaults
    - name: ansible-library
      configMap:
        name: splunk-ansible-library
  defaultsUrl: /mnt/tls-defaults/indexer.yml
  extraEnv:
    - name: SPLUNK_TLS_CA_PATH
      value: /mnt/splunk-ca/ca.crt
    # Verifying splunk_api override - see 03-licensemanager.yaml.
    - name: ANSIBLE_LIBRARY
      value: /mnt/ansible-library:/opt/ansible/library:/opt/ansible/apps/library:/opt/ansible/ansible_commands
  image: splunk/splunk:10.4.4
  # replicas must not exceed the pod names in tls/01-certificates.yaml
  # (splunk-indexer-tls); add names there and let it reissue first.
  replicas: 3
  clusterManagerRef:
    name: cm
    # namespace makes the operator pass the FQDN (…svc.cluster.local), not
    # the short service name: TLS host name validation checks the name dialled.
    namespace: splunk
  licenseManagerRef:
    name: lm
    # namespace makes the operator pass the FQDN (…svc.cluster.local), not
    # the short service name: TLS host name validation checks the name dialled.
    namespace: splunk
  monitoringConsoleRef:
    name: mc

  # ---- Arbitrary .conf settings on a tier with no appRepo ----
  #
  # IndexerCluster has NO appRepo field, so you cannot ship an app to it
  # directly. Two routes exist, and `defaults` is the one for small settings:
  #
  # Prefer a native splunk-ansible variable when one exists: root_endpoint is
  # written directly to etc/system/local/web.conf [settings] by
  # roles/splunk_common/tasks/set_root_endpoint.yml, no conf block needed.
  #
  #   defaults  -> rendered to a ConfigMap, mounted at
  #                /mnt/splunk-defaults/default.yml and passed to the container
  #                as SPLUNK_DEFAULTS_URL, where splunk-ansible applies it.
  #                Good for a handful of keys. Applied at container start.
  #
  #   ClusterManager appRepo, scope: cluster -> bundle-pushed to peers as
  #                etc/peer-apps. Use for anything app-shaped, or where you want
  #                the config versioned in S3 rather than in the CR.
  #
  # splunk.conf is a LIST. Each entry's `key` is the conf file name without the
  # extension, `directory` defaults to /opt/splunk/etc/system/local, and
  # `content` maps stanza -> key/value.
  #
  # splunk-ansible's spec warns that this method "may not create a configuration
  # file the way Splunk expects" and to verify the result - hence the btool check
  # below. Commented out because tools.proxy.on is almost certainly NOT what you
  # want behind Traefik; see README section 5.
  #
  # defaults: |-
  #   splunk:
  #     conf:
  #       - key: web
  #         value:
  #           directory: /opt/splunk/etc/system/local
  #           content:
  #             settings:
  #               tools.proxy.on: false
  #               root_endpoint: /splunk
  #
  # Verify what actually landed:
  #   kubectl -n splunk exec splunk-idxc-indexer-0 -- \
  #     /opt/splunk/bin/splunk btool web list settings --debug

  etcVolumeStorageConfig:
    storageClassName: splunk-gp3
    storageCapacity: 15Gi
  varVolumeStorageConfig:
    storageClassName: splunk-gp3
    # Sized for hot buckets + SmartStore cache, NOT for full retention.
    storageCapacity: 500Gi

  resources:
    requests:
      cpu: "4"
      memory: 12Gi
    limits:
      cpu: "8"
      memory: 24Gi

  # HARD separation: no two indexer peers may share a Kubernetes node.
  #
  # The operator already injects a podAntiAffinity term for this, but only as
  # PreferredDuringScheduling (weight 100) - see AppendPodAntiAffinity in
  # pkg/splunk/common/util.go. Preferred is best-effort: under pressure the
  # scheduler will happily stack two peers on one node, and a single node
  # failure then takes out two replicas at once.
  #
  # This Required term is what actually enforces it. The operator appends its
  # Preferred term to whatever is set here rather than replacing it, so both
  # end up on the pod.
  #
  # Consequence: you need at least as many schedulable nodes as replicas, in
  # the right AZs. A replica with nowhere to go stays Pending rather than
  # doubling up - which is the intended trade.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - splunk-idxc-indexer
          topologyKey: kubernetes.io/hostname

  # AZ spread stays SOFT on purpose. Hard zone spread (DoNotSchedule) would
  # leave pods Pending whenever a zone is short on capacity, and EBS volumes
  # are already pinned to a zone - so a replacement must return to its original
  # AZ regardless. Soft spread balances without blocking recovery.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: indexer
          app.kubernetes.io/part-of: splunk-cm-indexer
