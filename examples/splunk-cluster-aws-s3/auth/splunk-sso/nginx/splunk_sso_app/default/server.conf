# Some Splunk versions also consult the general trustedIP for SSO.
# Note this is SPLUNK WEB SSO only - it does NOT bind the management port.
#
# Do NOT bind 8089 to localhost. Cluster manager to peer traffic, search head
# to peer traffic, replication and the operator's own REST calls all cross pod
# boundaries on 8089. Binding it to loopback breaks the cluster. Port 8089 is
# protected by mutual TLS instead - see ../../../tls/.

[general]
trustedIP = 127.0.0.1
