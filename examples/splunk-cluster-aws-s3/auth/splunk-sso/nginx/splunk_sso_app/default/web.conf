# Splunk proxy SSO, fed by the nginx sidecar.
#
# Splunk product settings - verify against web.conf.spec for your version.
#
# The security of this entire scheme rests on two lines working together:
#   server.socket_host = 127.0.0.1   Splunk Web is reachable ONLY inside the pod
#   trustedIP          = 127.0.0.1   and only loopback may assert a username
#
# Because nginx is a sidecar it shares the pod's network namespace, so its
# connection to Splunk genuinely originates from 127.0.0.1. Nothing outside the
# pod can reach the port or satisfy the trustedIP check. That is what makes
# header-based SSO defensible here, where it would not be behind a shared proxy.

[settings]
# Bind Splunk Web to loopback only. This is the control that stops anyone
# bypassing nginx. Without it, any pod in the namespace could hit :8000
# directly and set its own REMOTE_USER.
server.socket_host = 127.0.0.1

# nginx terminates TLS, so Splunk Web itself speaks plain HTTP over loopback -
# traffic that never leaves the pod's network namespace.
enableSplunkWebSSL = false

# --- Proxy SSO ---
# strict: ONLY SSO logins are accepted. Requests without a valid REMOTE_USER
# from a trusted IP are refused outright.
# permissive: falls back to the normal login page - useful while testing, but
# leaves a password path open. Start permissive, move to strict.
SSOMode = strict

# Only loopback may assert an identity.
trustedIP = 127.0.0.1

# The header nginx sets from the client certificate CN.
remoteUser = REMOTE_USER

# Require an exact match rather than tolerating variations.
remoteUserMatchExact = 1

# Splunk builds URLs from its own view of host/port. nginx fronts it on 443,
# so tell Splunk what the browser actually sees or redirects break.
# (Same class of bug as the SAML redirectPort trap.)
tools.proxy.on = True
