# ProxySSO is a first-class authType - no auth script needed.
#
# Verified against the 10.4 authentication.conf reference:
#   authType = [Splunk|LDAP|Scripted|SAML|ProxySSO]
#
# Splunk maps groups supplied in proxy headers straight to Splunk roles, so the
# nginx sidecar can deliver both identity and authorization without a scripted
# auth handler or any call back to Keycloak at login time.

[authentication]
authType = ProxySSO
authSettings = nginx_proxy

[nginx_proxy]
# Applied when no group maps to a role. Set it to your least-privileged role -
# never to a role that can do anything meaningful, or an unmapped group silently
# becomes access.
defaultRoleIfMissing = user

# --- The footgun ---
# Per the reference: "If a group is not explicitly mapped to a Splunk role, but
# has the same name as a valid Splunk role, then, for ease of configuration, it
# is auto-mapped to that Splunk role."
#
# So a proxy-supplied group literally named "admin" becomes the admin role with
# no mapping entry at all. Exclude the privileged roles from auto-mapping.
# Splunk's own example excludes admin; do at least that.
excludedAutoMappedRoles = admin,sc_admin,splunk-system-role

# Users the proxy may name but Splunk must always refuse.
excludedUsers = admin,splunk-system-user

# --- Group to role mapping ---
# Left side is the SPLUNK role, right side is the semicolon-delimited group
# list as nginx sends it. No spaces around semicolons.
[roleMap_proxySSO]
admin = splunk-admins
power = splunk-power-users
user = splunk-users

# Optional: pin specific users to roles regardless of their groups. Useful for
# break-glass accounts; keep it short and audited.
# [userToRoleMap_proxySSO]
# jdoe = power;can_delete
