apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-sso-nginx
  namespace: splunk
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
      access_log /dev/stdout;
      # Writable paths under /tmp so the container can run read-only rootfs
      # as a non-root user.
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      # Extract the CN from the client certificate subject DN.
      # nginx has no built-in $ssl_client_s_dn_cn; modern nginx emits RFC2253
      # ("CN=jdoe,OU=Eng,O=Corp"), so parse it. If your PKI puts the identity in
      # a SAN instead, this regex is the wrong hook - see README.
      map $ssl_client_s_dn $client_cn {
        default              "";
        "~,?CN=(?<cn>[^,]+)" $cn;
      }

      map $http_upgrade $connection_upgrade_value {
        default upgrade;
        ''      close;
      }

      # Fail closed: no verified cert, no username, no access.
      map $ssl_client_verify $cert_ok {
        default "0";
        "SUCCESS" "1";
      }

      server {
        listen 8443 ssl;
        http2 on;
        server_name splunk.example.com;

        # --- Server side of TLS (what the browser validates) ---
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # --- Client certificate authentication ---
        # 'on' = reject the connection outright without a valid client cert.
        ssl_client_certificate /etc/nginx/pki/user-ca.pem;
        ssl_verify_client      on;
        ssl_verify_depth       2;
        # Revocation. nginx supports CRL only for client certs - there is no
        # OCSP check for the client side. This file must be refreshed or a
        # revoked certificate keeps working until it expires. See README.
        ssl_crl /etc/nginx/pki/user-ca.crl;

        location / {
          if ($cert_ok = "0") { return 403 "client certificate required\n"; }
          if ($client_cn = "")  { return 403 "no CN in client certificate\n"; }

          # THE critical line. proxy_set_header REPLACES any inbound header of
          # the same name, so a client cannot smuggle its own REMOTE_USER.
          # Never change this to add_header or make it conditional.
          proxy_set_header REMOTE_USER $client_cn;

          # Strip anything else a client might use to impersonate.
          proxy_set_header X-Remote-User "";
          proxy_set_header Remote-User   "";

          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header X-Forwarded-Port  443;

          # Loopback inside the pod's own network namespace. Splunk Web binds
          # 127.0.0.1 only, so this is the sole path to it.
          proxy_pass http://127.0.0.1:8000;

          proxy_http_version 1.1;
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection $connection_upgrade_value;

          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }

    }
