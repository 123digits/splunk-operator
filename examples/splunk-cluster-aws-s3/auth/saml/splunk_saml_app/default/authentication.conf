# Splunk SAML SSO against Keycloak.
#
# Setting names below are Splunk product configuration, NOT anything the
# operator knows about - the operator has no SSO support at all and simply runs
# whatever authentication.conf you ship it. Verify key names against the
# authentication.conf.spec for YOUR Splunk version before rolling out.

[authentication]
authType = SAML
authSettings = keycloak

[keycloak]
# --- Who Splunk is (the SP) ---
# entityId must match the Client ID of the SAML client you create in Keycloak.
entityId = splunk-shc

# fqdn / redirectPort are the settings that break behind a reverse proxy.
# Splunk builds its ACS URL from these. Users arrive on Traefik at :443, but
# Splunk Web listens on :8000 - without these it hands Keycloak a callback URL
# pointing at :8000 and the login round trip dead-ends. Set them to what the
# BROWSER sees, not what the pod sees.
fqdn = https://splunk.example.com
redirectPort = 443

# --- Who Keycloak is (the IdP) ---
# Realm endpoints. Descriptor (for the cert) lives at:
#   https://keycloak.example.com/realms/splunk/protocol/saml/descriptor
idpSSOUrl = https://keycloak.example.com/realms/splunk/protocol/saml
idpSLOUrl = https://keycloak.example.com/realms/splunk/protocol/saml

# Keycloak's realm SIGNING certificate, mounted from a secret at /mnt/saml.
# This is what makes the assertion trustworthy - it is the whole security
# boundary of SAML, so treat a change to this file as a security event.
idpCertPath = /mnt/saml/keycloak-signing.pem

# --- Assertion handling ---
# Require signed assertions and sign our own requests. Both sides authenticated.
signedAssertion = true
signAuthnRequest = true

# Keycloak's "Role list" mapper emits the attribute named "Role" by default,
# while Splunk looks for "role". Rather than fight it, tell Splunk the name.
# Case matters here and a mismatch is the single most common symptom of
# "login works but the user has no roles".
roleAttributeName = Role

# Splunk cannot do SAML attribute queries against Keycloak; roles must arrive
# in the assertion itself.
attributeQueryRequestSigned = false

# --- Map Keycloak groups/roles to Splunk roles ---
# Left side is the SPLUNK role, right side is the value Keycloak sends.
# Semicolon-separated for multiple.
[roleMap_SAML]
admin = splunk-admins
power = splunk-power-users
user = splunk-users
