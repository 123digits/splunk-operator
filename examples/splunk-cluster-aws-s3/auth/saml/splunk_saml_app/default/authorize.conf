# Splunk roles referenced by [roleMap_SAML].
#
# s4k_hs_admin maps to the built-in "admin" role, so nothing is defined here for
# it. s4k_hs_user needs defining because the built-in "user" role is not
# read-only - it can create and schedule saved searches and edit its own
# knowledge objects.
#
# Capability names are authorize.conf settings; verify against
# authorize.conf.spec for your Splunk version. Start from this and remove
# further, checking that dashboards still render.

[role_s4k_hs_user]
# Inherit nothing. Building up is safer than importing "user" and stripping,
# because a Splunk upgrade can add capabilities to built-in roles and silently
# widen an inherited role.
importRoles =

# View and run searches behind existing dashboards.
search = enabled
rest_properties_get = enabled

# Which indexes this role may read. Restrict deliberately - an empty list means
# no data, which is the safe failure.
srchIndexesAllowed = main;firewall;applogs
srchIndexesDefault = main

# Keep resource use bounded for a broad read-only population.
srchJobsQuota = 3
rtSrchJobsQuota = 0
srchDiskQuota = 100
srchMaxTime = 600

# Deliberately NOT granted, each of which the built-in "user" role has:
#   edit_own_objects    - creating/editing knowledge objects
#   schedule_search     - scheduled searches, which run unattended
#   edit_search_schedule_priority, edit_search_scheduler
#   rtsearch            - real-time searches are expensive
#   delete_by_keyword
