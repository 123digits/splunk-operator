# External OAuth2 JWT validation - for API clients, NOT browser login.
#
# This does NOT replace [authentication] authType. It sits alongside whatever
# interactive auth you run (SAML, in ../saml/). Splunk validates a Keycloak
# JWT presented as a bearer token on REST calls and maps its groups to roles.
#
# The stanza suffix must be the issuer URL EXACTLY, trailing slash included,
# and must equal the 'issuer' setting inside the stanza.

[oauth2_external_config_https://keycloak.example.com/realms/jcsc-oauth/]
issuer = https://keycloak.example.com/realms/jcsc-oauth/

# Where Splunk fetches Keycloak's public signing keys.
# WARNING: see the SSRF note in README.md - by default Splunk REFUSES JWKS
# endpoints on RFC1918 addresses, which is where an in-cluster Keycloak lives.
jwks_uri = https://keycloak.example.com/realms/jcsc-oauth/protocol/openid-connect/certs

# Must match the 'aud' claim exactly. In Keycloak this usually means adding an
# audience mapper to the client - Keycloak does not put the client ID in 'aud'
# by default, and a missing audience is a silent rejection.
audience = splunk-hs

# JWT claim carrying the client identifier.
clientIdClaim = azp

# JWT claim carrying group/role membership. For Keycloak REALM roles this is
# typically realm_access.roles; confirm against a decoded token rather than
# assuming, and add a Keycloak mapper if the claim is not present.
groupsClaim = realm_access.roles

friendlyName = splunk-hs
disable = false

# --- Map Keycloak realm roles to Splunk roles ---
# Same role names as the SAML path so both routes grant identically.
# Direction: <Keycloak realm role> = <Splunk roles>, i.e. the reverse of
# [roleMap_SAML] above. Both end up granting the same two Splunk roles.
[oauth2_external_role_mapping_https://keycloak.example.com/realms/jcsc-oauth/]
s4k_hs_admin = admin
s4k_hs_user = user
