# SearchHeadCluster - creates a deployer + N search heads (minimum 3).
# This is where your existing dashboards/apps go: scope "cluster" stages them on the
# deployer under etc/shcluster/apps and pushes to every member.
apiVersion: enterprise.splunk.com/v4
kind: SearchHeadCluster
metadata:
  annotations:
    # kiam: propagated to the pod template by the operator via AppendParentMeta,
    # so the pods assume this role. Must match the namespace's permitted regex.
    # Changing this value changes the pod template -> rolling restart.
    iam.amazonaws.com/role: SplunkS3Access
  name: shc
  namespace: splunk
  finalizers:
  - enterprise.splunk.com/delete-pvc
spec:
  # cert-manager secret mounted at /mnt/splunk-tls (operator mounts custom
  # volumes at /mnt/<name> in every container). tls-combined.pem is the
  # key+cert file Splunk's serverCert wants; ca.crt is what the verifying
  # probes and peer checks validate against.
  volumes:
    - name: splunk-tls
      secret:
        secretName: splunk-searchhead-tls
        defaultMode: 0400
    - name: splunk-public-tls
      secret:
        secretName: splunk-public-tls
        defaultMode: 0400
    # Keycloak realm signing cert -> /mnt/saml/keycloak-signing.pem,
    # matching idpCertPath in saml/splunk_saml_app.
    - name: saml
      secret:
        secretName: splunk-saml-idp
        defaultMode: 0400
  extraEnv:
    # Splunk Web over TLS. Probes target 8089, not 8000, so this does not
    # affect health checking.
    - name: SPLUNK_HTTP_ENABLESSL
      value: "true"
    # Consumed by the verifying probe scripts in tls/probes/.
    - name: SPLUNK_TLS_CA_PATH
      value: /mnt/splunk-tls/ca.crt
  image: splunk/splunk:10.2.0
  replicas: 3
  clusterManagerRef:
    name: cm
  licenseManagerRef:
    name: lm
  monitoringConsoleRef:
    name: mc

  etcVolumeStorageConfig:
    storageClassName: splunk-gp3
    # Search heads hold apps + user objects (saved searches, dashboards); keep headroom.
    storageCapacity: 30Gi
  varVolumeStorageConfig:
    storageClassName: splunk-gp3
    # Search artifacts / dispatch dir, not indexed data.
    storageCapacity: 100Gi

  resources:
    requests:
      cpu: "4"
      memory: 12Gi
    limits:
      cpu: "8"
      memory: 24Gi

  deployerResourceSpec:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  appRepo:
    appsRepoPollIntervalSeconds: 900
    defaults:
      volumeName: s3_apps
      scope: cluster
    appSources:
      # Your existing dashboard apps: cluster scope -> replicated to all search heads.
      - name: dashboardApps
        location: search-apps/
      # Search-time TAs (props/transforms/lookups/eventtypes).
      - name: searchTAs
        location: search-tas/
      # Deployer-only apps. Note: an app needed on BOTH deployer and members must be
      # listed twice with different names, same location, different scope.
      - name: deployerLocalApps
        location: search-apps/
        scope: local
      # authentication.conf must be identical on every member, so it goes
      # through the deployer at cluster scope.
      - name: samlAuth
        location: saml-auth/
    volumes:
      - name: s3_apps
        storageType: s3
        provider: aws
        path: my-splunk-apps/
        endpoint: https://s3.us-east-1.amazonaws.com
        region: us-east-1

  # HARD separation: no two search head members may share a Kubernetes node.
  #
  # The operator already injects a podAntiAffinity term for this, but only as
  # PreferredDuringScheduling (weight 100) - see AppendPodAntiAffinity in
  # pkg/splunk/common/util.go. Preferred is best-effort: under pressure the
  # scheduler will happily stack two peers on one node, and a single node
  # failure then takes out two replicas at once.
  #
  # This Required term is what actually enforces it. The operator appends its
  # Preferred term to whatever is set here rather than replacing it, so both
  # end up on the pod.
  #
  # Consequence: you need at least as many schedulable nodes as replicas, in
  # the right AZs. A replica with nowhere to go stays Pending rather than
  # doubling up - which is the intended trade.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - splunk-shc-search-head
          topologyKey: kubernetes.io/hostname

  # AZ spread stays SOFT on purpose. Hard zone spread (DoNotSchedule) would
  # leave pods Pending whenever a zone is short on capacity, and EBS volumes
  # are already pinned to a zone - so a replacement must return to its original
  # AZ regardless. Soft spread balances without blocking recovery.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: search-head
          app.kubernetes.io/part-of: splunk-shc-search-head
